name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swift-format'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swift-format'
      - '.github/workflows/swift-ci.yaml'
  workflow_dispatch: {}

# Cancel stale runs of the same ref. Pushes to main use run_id so each gets its own group
# (sharing one by ref can deadlock cancel-in-progress inside the reusable workflow).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Swift CI"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: request-dl/.github/.github/workflows/swift-ci.yaml@main
    with:
      name: i18next-swift
      product-name: I18next
      swift-version: '6.4'
      platform: xcode-27

      # Step 1 – Header Validation
      # Two accepted headers, matched as regular expressions: ours, and the Unicode one that the
      # generated CLDR files (Scripts/generate-plurals.py) carry.
      enable-header-validation: true
      header-use-regex: true
      header-template: |
        // Copyright (\(c\) 2026 Brenno Giovanini de Moura|© 1991-[0-9]{4} Unicode, Inc\.)
        // SPDX-License-Identifier: (MIT|Unicode-3\.0)

      # Step 2 – Format (generated files opt out with `swift-format-ignore-file`)
      enable-format: true
      format-swift-version: '6.4'

      # Step 3 – Breaking changes
      # Off until there is a tagged release to compare against.
      enable-breaking-changes: false
      skip-on-major-update: true
      force-skip-breaking-changes: ${{ contains(github.event.pull_request.labels.*.name, 'force-skip-ci') }}

      # Step 4 – Apple
      enable-apple-tests: true
      package-name: "i18next-swift-Package"
      xcode-version: '27.2'
      apple-coverage-enabled: true
      apple-tests-matrix: >-
        [{"destination":"platform=iOS Simulator,arch=arm64,name=iPhone 18 Pro,OS=27.2","name":"iOS"},
        {"destination":"platform=iOS Simulator,arch=arm64,name=iPad (A16),OS=27.2","name":"iPadOS"},
        {"destination":"platform=watchOS Simulator,arch=arm64,name=Apple Watch Series 12 (42mm),OS=27.2","name":"watchOS"},
        {"destination":"platform=tvOS Simulator,arch=arm64,name=Apple TV 4K (4th generation) (at 1080p),OS=27.2","name":"tvOS"},
        {"destination":"platform=visionOS Simulator,arch=arm64,name=Apple Vision Pro,OS=27.2","name":"visionOS"},
        {"destination":"platform=macOS,arch=arm64,name=My Mac","name":"macOS"},
        {"destination":"platform=macOS,arch=arm64,variant=Mac Catalyst,name=My Mac","name":"macOS Catalyst"}]

      # Step 4 – Linux (`swift test`)
      enable-third-party-tests: true
      third-party-coverage-enabled: true

      # Step 4 – Linkage: the `I18next` product must not link libFoundation.so on Linux
      enable-linkage-test: true

      # Step 4 – Android, release and static Linux SDK builds (these also build RequestDL through NIO)
      enable-android-build: true
      enable-release-builds: true
      enable-static-sdk: true

      # Step 5 – Needs a Codecov token for this repository.
      enable-coverage-upload: false
    secrets: inherit
